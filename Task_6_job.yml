resources:
  jobs:
    TPC_A_AIRLINE:
      name: TPC_A_AIRLINE
      email_notifications:
        on_failure:
          - adikamodiya@gmail.com
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: /Workspace/Users/adikamodiya@gmail.com/Projects/TPC-A-Airline-IAP/Task_2_ingestion
            base_parameters:
              pipeline_id: "{{job.run_id}}"
            source: WORKSPACE
          max_retries: 2
          min_retry_interval_millis: 900000
          disable_auto_optimization: false
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: /Workspace/Users/adikamodiya@gmail.com/Projects/TPC-A-Airline-IAP/Task_3_silver
            source: WORKSPACE
          max_retries: 1
          min_retry_interval_millis: 900000
          disable_auto_optimization: false
          email_notifications:
            on_failure:
              - adikamodiya@gmail.com
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: /Workspace/Users/adikamodiya@gmail.com/Projects/TPC-A-Airline-IAP/Task_4_Gold
            source: WORKSPACE
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
        - task_key: Data_Quality
          depends_on:
            - task_key: gold
          notebook_task:
            notebook_path: /Workspace/Users/adikamodiya@gmail.com/Projects/TPC-A-Airline-IAP/Task_5_quality_checks
            source: WORKSPACE
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
          email_notifications:
            on_success:
              - adikamodiya@gmail.com
      queue:
        enabled: true
      parameters:
        - name: catalog_name
          default: dev
      performance_target: PERFORMANCE_OPTIMIZED
